# Default one-shot ADB commands. Logs are captured from the Logs workspace.
commands:
- id: mtk_engineer_mode
  label: MTK Engineer Mode
  shell_command: am start com.mediatek.engineermode/com.mediatek.engineermode.EngineerMode
  category: action
  requires_root: false
- id: mtk_debuglogger
  label: MTK DebugLogger
  shell_command: am start com.debug.loggerui/com.debug.loggerui.MainActivity
  category: action
  requires_root: false
- id: unisoc_engineer_mode
  label: Unisoc Engineer Mode
  shell_command: am start -n com.sprd.engineermode/.EngineerModeActivity
  category: action
  requires_root: false
- id: unisoc_factory
  label: Unisoc Factory
  shell_command: am start -n com.sprd.validationtools/com.sprd.validationtools.ValidationToolsMainActivity
  category: action
  requires_root: true
- id: get_events
  label: Getevent 设备信息
  shell_command: getevent -lp
  category: read
  requires_root: false
- id: serial_port_info
  label: 串口信息
  shell_command: cat /proc/tty/driver/serial
  category: read
  requires_root: false
- id: memory_info_1
  label: 内存信息
  shell_command: cat /proc/meminfo
  category: read
  requires_root: false
- id: interrupt_info
  label: 中断信息
  shell_command: cat /proc/interrupts
  category: read
  requires_root: false
- id: gpio_status
  label: GPIO 状态
  shell_command: cat /sys/kernel/debug/gpio
  category: read
  requires_root: true
- id: brightness_1
  label: Brightness
  shell_command: cat /sys/class/leds/lcd-backlight/brightness
  category: read
  requires_root: true
- id: audio_pcm
  label: Audio pcm
  shell_command: cat /proc/asound/pcm
  category: read
  requires_root: false
- id: tinymix
  label: tinymix
  shell_command: tinymix
  category: read
  requires_root: false
- id: audio_register
  label: Audio Register Info
  shell_command: cat /sys/kernel/debug/mtksocaudio
  category: read
  requires_root: true
- id: pkill_audioserver
  label: pkill audioserver
  shell_command: pkill audioserver
  category: action
  requires_root: true
- id: touch
  label: touch
  shell_command: settings put system show_touches 1 && settings put system pointer_location 1
  category: action
  requires_root: true
- id: tp
  label: 获取 tp 版本
  shell_command: echo v >proc/android_touch/debug && cat proc/android_touch/debug
  category: read
  requires_root: true
